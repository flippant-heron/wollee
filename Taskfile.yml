version: '3'

includes:
  assets: ./tasks/assets.taskfile.yml
  build: ./tasks/build.taskfile.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run linter
    cmds:
      # - golangci-lint run
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run --timeout=5m --enable=errcheck --enable=unused

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out coverage.html

  mod:tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  build:local:
    desc: Build local binaries (current OS)
    deps:
      - build:_check-assets
    cmds:
      - go build -o {{.ROOT_DIR}}/dist/agent {{.ROOT_DIR}}/cmd/agent
      - go build -o {{.ROOT_DIR}}/dist/server {{.ROOT_DIR}}/cmd/server

  build:
    desc: Alias for build:all - build all cross-platform release artifacts
    cmds:
      - task: build:all
