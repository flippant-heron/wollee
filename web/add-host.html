<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Host - wollee</title>
  <link rel="stylesheet" href="/static/blades.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/material-symbols.css">
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <script src="/static/common.js"></script>
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>wollee</strong></li></ul>
      <button type="button" class="nav-toggle" onclick="document.querySelector('nav ul:last-child').classList.toggle('active')" title="Toggle menu">
        <span class="material-symbols-outlined sm">menu</span>
      </button>
      <ul>
        <li><button type="button" onclick="window.location.href = '/'" title="Back to home">
          <span class="material-symbols-outlined sm">arrow_back</span>
        </button></li>
        <li><button type="button" onclick="toggleTheme()" title="Toggle dark mode">
          <span class="material-symbols-outlined sm">dark_mode</span>
        </button></li>
      </ul>
    </nav>

    <article>
      <header>
        <h1>Add new host</h1>
        <p>Register a new Wake-on-LAN host.</p>
      </header>

      <div id="form-result"></div>

      <form hx-post="/add-host" hx-target="#form-result" hx-swap="innerHTML">
        <div>
          <label for="hostname">Hostname</label>
          <input id="hostname" type="text" name="hostname" placeholder="e.g., desktop-1">
        </div>
        <div>
          <label for="mac">MAC address</label>
          <input id="mac" type="text" name="mac" placeholder="e.g., 00:11:22:33:44:55" required>
        </div>
        <div>
          <label for="ip">IP address</label>
          <input id="ip" type="text" name="ip" placeholder="e.g., 192.168.1.100" required>
        </div>
        <div style="display: flex; gap: 1rem;">
          <button type="submit" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined sm">add_circle</span>
            <span>Add Host</span>
          </button>
          <button type="button" hx-get="/" hx-boost="true" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined sm">cancel</span>
            <span>Cancel</span>
          </button>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
