<\!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - wollee</title>
  <link rel="stylesheet" href="/static/blades.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/material-symbols.css">
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <script src="/static/common.js"></script>
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>wollee</strong></li></ul>
      <button type="button" class="nav-toggle" onclick="document.querySelector('nav ul:last-child').classList.toggle('active')" title="Toggle menu">
        <span class="material-symbols-outlined sm">menu</span>
      </button>
      <ul>
        <li><button type="button" onclick="window.location.href = '/'" title="Back to home">
          <span class="material-symbols-outlined sm">arrow_back</span>
        </button></li>
        <li><button type="button" onclick="toggleTheme()" title="Toggle dark mode">
          <span class="material-symbols-outlined sm">dark_mode</span>
        </button></li>
      </ul>
    </nav>

    <article>
      <header>
        <h1>Settings</h1>
        <p>Configure server behavior and integrations.</p>
      </header>

      <div id="settings-result"></div>

      <form hx-post="/settings" hx-target="#settings-result" hx-swap="innerHTML">
        <fieldset>
          <legend>Network</legend>
          <div>
            <label for="network">Broadcast Address (CIDR)</label>
            <input id="network" type="text" name="network" placeholder="192.168.1.0/24" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>Heartbeat Monitoring</legend>
          <div>
            <label for="heartbeat">Heartbeat Interval</label>
            <input id="heartbeat" type="text" name="heartbeat" placeholder="30s" required>
          </div>
          <div>
            <label for="timeout">Timeout</label>
            <input id="timeout" type="text" name="timeout" placeholder="5m" required>
          </div>
          <div>
            <label for="configRefresh">Config Refresh Interval</label>
            <input id="configRefresh" type="text" name="configRefresh" placeholder="5m" required>
          </div>
          <div>
            <label for="whoami">
              <input id="whoami" type="checkbox" name="whoami">
              Enable /whoami endpoint
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Telegram Bot</legend>
          <div>
            <label for="telegramToken">Bot Token</label>
            <input id="telegramToken" type="password" name="telegramToken" placeholder="Paste your Telegram bot token">
          </div>
          <div>
            <label for="telegramUsers">Authorized User IDs (comma-separated)</label>
            <textarea id="telegramUsers" name="telegramUsers" placeholder="e.g., 123456789, 987654321" style="min-height: 60px;"></textarea>
          </div>
        </fieldset>

        <div style="display: flex; gap: 1rem;">
          <button type="submit">
            <span class="material-symbols-outlined sm">save</span>
            Save Settings
          </button>
          <button type="button" hx-get="/" hx-boost="true" style="background-color: var(--button-secondary, #e0e0e0);">
            <span class="material-symbols-outlined sm">cancel</span>
            Cancel
          </button>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
