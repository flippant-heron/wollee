<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wollee</title>
  <link rel="stylesheet" href="/static/blades.min.css">
  <link rel="stylesheet" href="/static/material-symbols.css">
  <script defer src="/static/alpine.min.js"></script>
  <script src="/static/common.js"></script>
  <style>
    /* Layout & spacing */
    main.container { padding: 1rem; }
    nav { margin: 0.5rem 0; }
    nav ul { margin: 0; }
    nav li { display: inline; margin-right: 0.5rem; }
    
    /* Navbar */
    nav { margin: 0.5rem 0; display: flex; align-items: center; gap: 1rem; }
    nav ul { margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    nav li { display: flex; align-items: center; }
    nav li strong { margin-right: auto; }
    
    /* Navbar buttons */
    nav button { 
      padding: 0.5rem;
      font-size: 1rem;
      width: auto;
      height: auto;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    nav button:hover { opacity: 1; }
    nav button.secondary { background: none; border: none; }
    
    /* Action button styling */
    table button { display: flex; align-items: center; justify-content: center; }
    table button span:first-child { margin-right: 0.25rem; }
    
    /* Status indicators */
    .status-dot { display: inline-block; width: .75rem; height: .75rem; border-radius: 999px; margin-right: .5rem; }
    .status-online { background: #2fb344; }
    .status-offline { background: #d63939; }
    
    /* Code */
    code { white-space: nowrap; }
    
    /* Tables */
    table td, table th { padding: 0.75rem; }
    dialog { padding: 0; }
    dialog article { margin: 0; }
    dialog header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 0; }
    dialog header h3 { margin: 0; }
    dialog header button { padding: 0; min-height: auto; }
    dialog footer { display: flex; gap: 0.5rem; justify-content: flex-end; }
  </style>
</head>
<body>
  <main class="container" x-data="wolleeApp()" x-init="$store.theme.init(); load()">
    <nav>
      <ul><li><strong>wollee</strong></li></ul>
      <ul>
        <li><button type="button" @click="load()" :aria-busy="loading" title="Refresh host list">
          <span class="material-symbols-outlined sm">refresh</span>
        </button></li>
        <li><button type="button" @click="reloadConfig()" :aria-busy="loading" title="Reload configuration">
          <span class="material-symbols-outlined sm">settings_backup_restore</span>
        </button></li>
        <li><button type="button" @click="navigateTo('/settings')" title="Settings">
          <span class="material-symbols-outlined sm">settings</span>
        </button></li>
        <li><button type="button" @click="navigateTo('/add-host')" title="Add new host">
          <span class="material-symbols-outlined sm">add_circle</span>
        </button></li>
        <li><button type="button" @click="$store.theme.toggle()" title="Toggle dark mode">
          <span class="material-symbols-outlined sm" x-text="$store.theme.dark ? 'light_mode' : 'dark_mode'"></span>
        </button></li>
      </ul>
    </nav>

    <article>
      <header>
        <h1>Wake-on-LAN hosts</h1>
        <p>Registered clients appear below with their most recent heartbeat.</p>
      </header>

      <template x-if="error">
        <p><mark x-text="error"></mark></p>
      </template>

      <figure style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th title="Wake" style="text-align: center; width: 3rem;"><span class="material-symbols-outlined xs">power_settings_new</span></th>
              <th>Status</th>
              <th>Hostname</th>
              <th>MAC</th>
              <th>IP</th>
              <th>Last seen</th>
              <th title="Actions" style="text-align: center; width: 3rem;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="hosts.length === 0">
              <tr><td colspan="7">No hosts registered yet.</td></tr>
            </template>
            <template x-for="host in hosts" :key="host.mac">
              <tr>
                <td style="text-align: center;">
                  <button type="button" @click="wake(host.mac)" :disabled="loading" title="Send wake-on-LAN packet to this host">
                    <span class="material-symbols-outlined sm">power_settings_new</span>
                  </button>
                </td>
                <td><span class="status-dot" :class="host.active ? 'status-online' : 'status-offline'"></span><span x-text="host.active ? 'Online' : 'Offline'"></span></td>
                <td x-text="host.hostname"></td>
                <td><code x-text="host.mac"></code></td>
                <td x-text="host.ip"></td>
                <td x-text="new Date(host.lastSeen).toLocaleString()"></td>
                <td style="text-align: center;">
                  <button type="button" @click="deleteHost(host.mac)" :disabled="loading" title="Delete this host">
                    <span class="material-symbols-outlined sm">delete</span>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </figure>
    </article>
  </main>

  <script>
    function wolleeApp() {
      return {
        hosts: [],
        loading: false,
        error: '',
        async load() {
          this.loading = true;
          this.error = '';
          try {
            const response = await fetch('/status');
            if (!response.ok) {
              throw new Error(`status request failed: ${response.status}`);
            }
            const payload = await response.json();
            this.hosts = payload.hosts ?? [];
          } catch (error) {
            this.error = error.message;
          } finally {
            this.loading = false;
          }
        },
        navigateTo(path) {
          window.location.href = path;
        },
        async wake(mac) {
          this.error = '';
          try {
            const response = await fetch('/wake', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mac })
            });
            if (!response.ok) {
              const payload = await response.json().catch(() => ({ error: 'wake request failed' }));
              throw new Error(payload.error || `wake request failed: ${response.status}`);
            }
            // Find the hostname for the toast message
            const host = this.hosts.find(h => h.mac === mac);
            const hostname = host?.hostname || mac;
            showToast(`WOL packet sent to ${hostname}`, 3000, 'success');
            await this.load();
          } catch (error) {
            this.error = error.message;
            showToast(`Failed to send WOL: ${error.message}`, 4000, 'error');
          }
        },
        async deleteHost(mac) {
          this.error = '';
          const host = this.hosts.find(h => h.mac === mac);
          const hostname = host?.hostname || mac;
          const confirmed = await confirmModal('Delete Host', `Are you sure you want to delete ${hostname}?`);
          if (!confirmed) {
            return;
          }
          try {
            const response = await fetch(`/hosts/${mac}`, {
              method: 'DELETE'
            });
            if (!response.ok) {
              const payload = await response.json().catch(() => ({ error: 'delete request failed' }));
              throw new Error(payload.error || `delete request failed: ${response.status}`);
            }
            showToast(`${hostname} deleted successfully`, 2000, 'success');
            await this.load();
          } catch (error) {
            this.error = error.message;
            showToast(`Failed to delete: ${error.message}`, 4000, 'error');
          }
        },
        async reloadConfig() {
          this.error = '';
          try {
            const response = await fetch('/config/reload', {
              method: 'POST'
            });
            if (!response.ok) {
              const payload = await response.json().catch(() => ({ error: 'reload failed' }));
              throw new Error(payload.error || `reload failed: ${response.status}`);
            }
            showToast('Configuration reloaded successfully', 2000, 'success');
            // Reload the page data after config is reloaded
            await this.load();
          } catch (error) {
            this.error = error.message;
            showToast(`Reload failed: ${error.message}`, 4000, 'error');
          }
        }
      };
    }
  </script>
</body>
</html>
